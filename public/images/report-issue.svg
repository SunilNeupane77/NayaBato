<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#f0fdfa"/>
  
  <!-- Form and Image -->
  <rect x="20" y="20" width="180" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Form Fields -->
  <rect x="40" y="40" width="140" height="20" rx="4" fill="#f1f5f9"/>
  <rect x="40" y="70" width="140" height="20" rx="4" fill="#f1f5f9"/>
  <rect x="40" y="100" width="140" height="40" rx="4" fill="#f1f5f9"/>
  <rect x="40" y="150" width="70" height="20" rx="4" fill="#0ea5e9"/>
  
  <!-- Image Upload Section -->
  <rect x="220" y="20" width="160" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="240" y="40" width="120" height="80" rx="4" fill="#d1fae5" stroke="#bae6fd" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Camera Icon -->
  <circle cx="300" cy="80" r="20" fill="#bae6fd" opacity="0.6"/>
  <path d="M290,80 l10,-10 l10,10 l-10,10 z" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Map Indicator -->
  <rect x="240" y="130" width="120" height="40" rx="4" fill="#f1f5f9"/>
  <circle cx="260" cy="150" r="8" fill="#10b981"/>
  <text x="300" y="155" font-family="Arial" font-size="10" fill="#64748b">Select Location</text>
</svg>
