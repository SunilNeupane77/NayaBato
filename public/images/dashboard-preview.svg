<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard Background -->
  <rect width="500" height="300" fill="#f0f4f8"/>
  
  <!-- Header Bar -->
  <rect width="500" height="40" fill="#4299e1"/>
  <text x="250" y="25" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Nayabato Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="0" y="40" width="100" height="260" fill="#e2e8f0"/>
  
  <!-- Content Area -->
  <rect x="110" y="50" width="380" height="90" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="110" y="150" width="185" height="140" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="305" y="150" width="185" height="140" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Charts and Elements -->
  <rect x="120" y="70" width="360" height="60" rx="4" fill="#ebf8ff"/>
  <circle cx="140" cy="100" r="10" fill="#3182ce"/>
  <rect x="160" y="95" width="310" height="10" rx="2" fill="#bee3f8"/>
  
  <rect x="120" y="170" width="165" height="100" rx="4" fill="#e6fffa"/>
  <circle cx="160" cy="210" r="30" fill="#4fd1c5" opacity="0.7"/>
  <circle cx="220" cy="210" r="20" fill="#38b2ac" opacity="0.7"/>
  
  <rect x="315" y="170" width="165" height="100" rx="4" fill="#faf5ff"/>
  <rect x="335" y="190" width="15" height="60" fill="#9f7aea"/>
  <rect x="360" y="210" width="15" height="40" fill="#9f7aea"/>
  <rect x="385" y="180" width="15" height="70" fill="#9f7aea"/>
  <rect x="410" y="220" width="15" height="30" fill="#9f7aea"/>
  <rect x="435" y="200" width="15" height="50" fill="#9f7aea"/>
</svg>
