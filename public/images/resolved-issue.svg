<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#ecfdf5"/>
  
  <!-- Before/After Section -->
  <rect x="20" y="40" width="160" height="120" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#4b5563">Before</text>
  <rect x="30" y="50" width="140" height="100" rx="4" fill="#fee2e2"/>
  <circle cx="100" cy="100" r="30" fill="#ef4444" opacity="0.7"/>
  <path d="M90,90 L110,110 M90,110 L110,90" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <rect x="220" y="40" width="160" height="120" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="300" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#4b5563">After</text>
  <rect x="230" y="50" width="140" height="100" rx="4" fill="#d1fae5"/>
  <circle cx="300" cy="100" r="30" fill="#10b981" opacity="0.7"/>
  <path d="M290,100 L298,108 L312,92" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Success Banner -->
  <rect x="120" y="170" width="160" height="24" rx="12" fill="#059669"/>
  <text x="200" y="186" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Issue Successfully Resolved</text>
  
  <!-- Resolution Badge -->
  <circle cx="370" cy="30" r="20" fill="#10b981" opacity="0.2"/>
  <circle cx="370" cy="30" r="15" fill="#10b981"/>
  <path d="M362,30 L368,36 L378,24" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
