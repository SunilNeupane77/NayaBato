services:
  app:
    build:
      context: .
      args:
        - MONGODB_URI=mongodb://mongo:27017/nayabato
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dummy-secret-for-build}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
        - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dummy}
        - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-dummy}
        - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-dummy}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/nayabato
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      - mongo
    networks:
      - nayabato-network

  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nayabato-network

volumes:
  mongo-data:

networks:
  nayabato-network:
    driver: bridge
